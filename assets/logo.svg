<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">Skillid Logo</title>
  <desc id="desc">A dark shield with a policy document and circuit lines, representing agent guardrails.</desc>
  <defs>
    <linearGradient id="bg" x1="128" y1="96" x2="896" y2="928" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#111827"/>
      <stop offset="1" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="accent" x1="256" y1="224" x2="768" y2="800" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="0.55" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#a855f7"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="1024" height="1024" rx="192" fill="url(#bg)"/>

  <g filter="url(#shadow)">
    <path d="M512 134 794 244v214c0 183-103 350-282 435C333 808 230 641 230 458V244l282-110Z" fill="#0f172a" stroke="url(#accent)" stroke-width="34" stroke-linejoin="round"/>
    <path d="M512 190 738 278v180c0 144-76 279-226 354-150-75-226-210-226-354V278l226-88Z" fill="#111827"/>
  </g>

  <!-- Policy document -->
  <g>
    <rect x="342" y="286" width="300" height="392" rx="34" fill="#e5e7eb"/>
    <path d="M572 286v94h70" fill="#cbd5e1"/>
    <path d="M572 286v94h70" fill="none" stroke="#94a3b8" stroke-width="14" stroke-linejoin="round"/>

    <rect x="396" y="412" width="186" height="22" rx="11" fill="#334155"/>
    <rect x="396" y="476" width="160" height="22" rx="11" fill="#334155"/>
    <rect x="396" y="540" width="206" height="22" rx="11" fill="#334155"/>
  </g>

  <!-- Check / enforcement mark -->
  <path d="M394 642 474 722 670 482" fill="none" stroke="url(#accent)" stroke-width="58" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Circuit guardrails -->
  <g fill="none" stroke="#38bdf8" stroke-width="18" stroke-linecap="round" opacity="0.88">
    <path d="M238 376h86"/>
    <path d="M238 512h74"/>
    <path d="M700 376h86"/>
    <path d="M704 512h74"/>
  </g>
  <g fill="#38bdf8" opacity="0.95">
    <circle cx="222" cy="376" r="18"/>
    <circle cx="222" cy="512" r="18"/>
    <circle cx="802" cy="376" r="18"/>
    <circle cx="794" cy="512" r="18"/>
  </g>

  <!-- Wordmark -->
  <text x="512" y="862" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="92" font-weight="800" letter-spacing="-3" fill="#f8fafc">skillid</text>
</svg>
