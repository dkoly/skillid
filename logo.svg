<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400" role="img">
  <title>Skillid logo</title>
  <desc>Cast iron skillet with shield and checkmark embossed, with skillid wordmark below</desc>

  <!-- Handle pointing left -->
  <rect x="18" y="163" width="80" height="26" rx="13" fill="#2c2c2c"/>
  <rect x="18" y="171" width="80" height="10" rx="5" fill="#c0522a"/>
  <circle cx="40" cy="176" r="5" fill="#1a1a1a"/>
  <circle cx="40" cy="176" r="2.5" fill="#555"/>

  <!-- Connection collar -->
  <rect x="92" y="159" width="16" height="34" rx="4" fill="#222"/>

  <!-- Pan outer body -->
  <circle cx="210" cy="176" r="105" fill="#2c2c2c"/>
  <circle cx="210" cy="176" r="105" fill="none" stroke="#1a1a1a" stroke-width="6"/>
  <!-- Pan inner cooking surface -->
  <circle cx="210" cy="176" r="90" fill="#3a3a3a"/>
  <!-- Sheen arc -->
  <path d="M 132 146 A 80 80 0 0 1 174 132" fill="none" stroke="#505050" stroke-width="6" stroke-linecap="round"/>

  <!-- Shield embossed -->
  <path d="M 210 136 L 244 148 L 244 173 Q 244 200 210 212 Q 176 200 176 173 L 176 148 Z" fill="none" stroke="#c0522a" stroke-width="3" stroke-linejoin="round"/>
  <!-- Checkmark -->
  <polyline points="194,175 207,188 228,160" fill="none" stroke="#c0522a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Wordmark centered -->
  <text x="200" y="330" font-family="Arial, sans-serif" font-size="42" font-weight="400" fill="#2c2c2c" text-anchor="middle">skill<tspan font-weight="700" fill="#c0522a">id</tspan></text>

  <!-- Tagline -->
  <text x="200" y="358" font-family="Arial, sans-serif" font-size="11" fill="#888" text-anchor="middle" letter-spacing="2.5">ORG POLICY GENERATOR</text>

</svg>
