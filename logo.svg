<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="shieldGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e3a5f"/>
      <stop offset="100%" stop-color="#0f2440"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00d4aa"/>
      <stop offset="100%" stop-color="#0099cc"/>
    </linearGradient>
  </defs>

  <!-- Shield body -->
  <path d="M256 28 L462 120 L462 260 C462 370 370 460 256 492 C142 460 50 370 50 260 L50 120 Z"
        fill="url(#shieldGrad)" stroke="url(#accentGrad)" stroke-width="6"/>

  <!-- Inner shield highlight -->
  <path d="M256 60 L432 140 L432 255 C432 350 350 430 256 458 C162 430 80 350 80 255 L80 140 Z"
        fill="none" stroke="url(#accentGrad)" stroke-width="2" opacity="0.3"/>

  <!-- Circuit/node pattern - central node -->
  <circle cx="256" cy="240" r="32" fill="url(#accentGrad)"/>
  <circle cx="256" cy="240" r="18" fill="#0f2440"/>
  <circle cx="256" cy="240" r="8" fill="url(#accentGrad)"/>

  <!-- Top node -->
  <line x1="256" y1="208" x2="256" y2="148" stroke="url(#accentGrad)" stroke-width="4" stroke-linecap="round"/>
  <circle cx="256" cy="140" r="14" fill="url(#accentGrad)"/>
  <circle cx="256" cy="140" r="6" fill="#0f2440"/>

  <!-- Bottom node -->
  <line x1="256" y1="272" x2="256" y2="340" stroke="url(#accentGrad)" stroke-width="4" stroke-linecap="round"/>
  <circle cx="256" cy="348" r="14" fill="url(#accentGrad)"/>
  <circle cx="256" cy="348" r="6" fill="#0f2440"/>

  <!-- Left node -->
  <line x1="224" y1="240" x2="160" y2="200" stroke="url(#accentGrad)" stroke-width="4" stroke-linecap="round"/>
  <circle cx="152" cy="196" r="14" fill="url(#accentGrad)"/>
  <circle cx="152" cy="196" r="6" fill="#0f2440"/>

  <!-- Right node -->
  <line x1="288" y1="240" x2="352" y2="200" stroke="url(#accentGrad)" stroke-width="4" stroke-linecap="round"/>
  <circle cx="360" cy="196" r="14" fill="url(#accentGrad)"/>
  <circle cx="360" cy="196" r="6" fill="#0f2440"/>

  <!-- Bottom-left node -->
  <line x1="236" y1="265" x2="175" y2="310" stroke="url(#accentGrad)" stroke-width="4" stroke-linecap="round"/>
  <circle cx="168" cy="316" r="14" fill="url(#accentGrad)"/>
  <circle cx="168" cy="316" r="6" fill="#0f2440"/>

  <!-- Bottom-right node -->
  <line x1="276" y1="265" x2="337" y2="310" stroke="url(#accentGrad)" stroke-width="4" stroke-linecap="round"/>
  <circle cx="344" cy="316" r="14" fill="url(#accentGrad)"/>
  <circle cx="344" cy="316" r="6" fill="#0f2440"/>

  <!-- Checkmark overlay (subtle, in center node) -->
  <path d="M244 240 L253 249 L270 230" stroke="#0f2440" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
</svg>
